name: Build GBA Writer ROM

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-fatfs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GBA Writer
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install sector-image test dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc g++ python3 dosfstools
      - name: Test actual FatFS and interrupted-save recovery
        run: python3 tests/run_fatfs_tests.py
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm@sha256:15b79ce75822c289538d8153da5fa7aafe5e6adc32ad8a575a197beca0f0761b   # 20260610, linux/amd64; the same image in all four apps
    steps:
      - name: Check out GBA Writer
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Check out pinned Butano
        uses: actions/checkout@v4
        with:
          repository: GValiente/butano
          ref: 77dcbcb3d8783596a9f333c64eedbccec77b05dc
          path: _butano
      - name: Run host tests
        run: bash tests/run_host_tests.sh
      - name: Build complete ROM and check memory
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
        run: |
          make -j2 LIBBUTANO="$GITHUB_WORKSPACE/_butano/butano"
          make memory-check LIBBUTANO="$GITHUB_WORKSPACE/_butano/butano"
          test -s gbawriter.gba
      - name: Upload ROM and ELF
        uses: actions/upload-artifact@v4
        with:
          name: gbawriter-rom
          path: |
            gbawriter.gba
            gbawriter.elf
          if-no-files-found: error

  # The exact ROM on mGBA: one script (import, open, edit, save) on the
  # SuperCard, EZ-Flash Omega and EverDrive models (gbaSD); every screen and
  # every file on the card must match the SuperCard run.
  emulator:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: gbawriter-rom
      - name: Install mGBA library, FAT tools and ARM binutils (RAM-code check)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libmgba-dev mtools dosfstools binutils-arm-none-eabi
          mkdir -p "$RUNNER_TEMP/arm/bin" && ln -s /usr/bin/arm-none-eabi-nm /usr/bin/arm-none-eabi-objdump "$RUNNER_TEMP/arm/bin/"
          echo "DEVKITARM=$RUNNER_TEMP/arm" >> "$GITHUB_ENV"
      - name: SuperCard / Omega / EverDrive differential test
        run: python3 tests/emu/ezfo_test.py gbawriter.gba
